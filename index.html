<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Rocket</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height: 100dvh;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    position: fixed;
    width: 100%;
    user-select: none;
  }
  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 8px);
  }
  .header { display:flex; justify-content:space-between; align-items:center; padding:8px 0; z-index:5; flex-shrink:0; }
  .coin { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:800; }
  .coin-icon { width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #ffe066, #d4a017, #8a6508); box-shadow:0 0 8px rgba(255,215,0,0.5); }
  .balance { color:#ffd700; font-variant-numeric:tabular-nums; }
  .add-btn { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#1e40af,#3b82f6); border:none; color:#fff; font-size:18px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 0 12px rgba(59,130,246,0.5); }
  .add-btn:active { transform:scale(0.9); }

  .history { display:flex; gap:6px; overflow-x:auto; padding:6px 0; z-index:5; flex-shrink:0; min-height:36px; }
  .history::-webkit-scrollbar { display:none; }
  .h-item { flex-shrink:0; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:800; background:#0a0a0a; border:1px solid; font-variant-numeric:tabular-nums; }
  .h-red { color:#ff4d4d; border-color:rgba(255,77,77,0.4); box-shadow:0 0 8px rgba(255,77,77,0.2); }
  .h-blue { color:#4d94ff; border-color:rgba(77,148,255,0.4); box-shadow:0 0 8px rgba(77,148,255,0.2); }
  .h-purple { color:#b366ff; border-color:rgba(179,102,255,0.4); box-shadow:0 0 8px rgba(179,102,255,0.2); }
  .h-gold { color:#ffd700; border-color:rgba(255,215,0,0.4); box-shadow:0 0 8px rgba(255,215,0,0.2); }

  .main-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
  }
  .main {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  .mult-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none; z-index: 3;
  }
  .mult {
    font-size: 62px; font-weight: 900;
    transition: color 0.6s;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 30px currentColor;
    line-height: 1;
  }
  .status {
    margin-top: 8px; font-size: 12px; color: #666;
    height: 16px; font-weight: 600;
  }
  .status.wait { color: #ffd700; }
  .status.crash { color: #ff4d4d; font-weight: 800; }
  .countdown {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7); z-index: 10;
    backdrop-filter: blur(4px);
  }
  .countdown.on { display: flex; }
  .countdown-num {
    font-size: 90px; font-weight: 900; color: #ffd700;
    animation: pulse 1s infinite;
    text-shadow: 0 0 40px rgba(255,215,0,0.8);
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.7; }
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .action-bar {
    padding: 8px 0;
    z-index: 5;
    position: relative;
  }
  .btn {
    height: 54px;
    border-radius: 14px;
    border: none;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-appearance: none;
    width: 100%;
  }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn-bet {
    background: linear-gradient(135deg, #0ea5e9, #3b82f6);
    color: #fff;
    box-shadow: 0 4px 20px rgba(59,130,246,0.4);
  }
  .btn-bet:disabled {
    background: rgba(255,255,255,0.06);
    color: #444;
    box-shadow: none;
  }
  .btn-cash {
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #fff;
    box-shadow: 0 4px 20px rgba(34,197,94,0.4);
  }
  .btn-cash:disabled {
    background: rgba(255,255,255,0.06);
    color: #444;
    box-shadow: none;
  }

  .players {
    max-height: 150px;
    overflow-y: auto;
    padding: 6px 0;
    z-index: 5;
    -webkit-overflow-scrolling: touch;
  }
  .players::-webkit-scrollbar { display: none; }
  .player {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; margin-bottom: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; font-size: 13px;
  }
  .player-avatar {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg,#1e40af,#3b82f6);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #fff;
    flex-shrink: 0;
  }
  .player-info { flex: 1; min-width: 0; }
  .player-name {
    font-weight: 700; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player-bet {
    display: flex; align-items: center; gap: 4px;
    margin-top: 3px; font-size: 11px; color: #888; font-weight: 600;
  }
  .mini-coin {
    width: 11px; height: 11px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe066, #d4a017);
    display: inline-block;
  }
  .player-win {
    background: linear-gradient(135deg,#1a5a8a,#2a8ac0);
    color: #fff; font-weight: 800; font-size: 13px;
    padding: 6px 12px; border-radius: 10px;
    display: flex; align-items: center; gap: 4px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .player-win.cashed {
    background: linear-gradient(135deg,#1a8a4a,#22c55e);
    box-shadow: 0 0 10px rgba(34,197,94,0.4);
  }

  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(0.8);
    background: rgba(0,0,0,0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px; padding: 16px 28px;
    font-size: 18px; font-weight: 800;
    opacity: 0; pointer-events: none;
    transition: all 0.3s; z-index: 100;
    backdrop-filter: blur(20px);
  }
  .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .toast.win { color: #22c55e; border-color: rgba(34,197,94,0.4); }
  .toast.lose { color: #ff4d4d; border-color: rgba(255,77,77,0.4); }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: none; align-items: flex-end;
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal.on { display: flex; }
  .modal-content {
    width: 100%; background: #0f0f0f;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 32px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .modal-title {
    font-size: 18px; font-weight: 800;
    margin-bottom: 16px; text-align: center;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 13px; color: #888;
    margin-bottom: 6px; font-weight: 600;
  }
  .field input {
    width: 100%; height: 52px; border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 16px; font-weight: 600;
    padding: 0 16px; outline: none;
    -webkit-appearance: none;
  }
  .field input:focus { border-color: #3b82f6; }
  .quick-bets { display: flex; gap: 8px; margin-bottom: 14px; }
  .quick-bet {
    flex: 1; height: 40px; border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff; font-weight: 700; font-size: 14px;
  }
  .quick-bet:active { background: rgba(255,255,255,0.15); }
  .modal-btn {
    width: 100%; height: 52px; border-radius: 14px;
    border: none; font-size: 16px; font-weight: 800;
    background: linear-gradient(135deg,#0ea5e9,#3b82f6);
    color: #fff; margin-top: 8px;
  }
  .modal-cancel {
    background: rgba(255,255,255,0.06);
    color: #888; margin-top: 8px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="coin">
      <div class="coin-icon"></div>
      <div class="balance" id="balance">1000</div>
      <button class="add-btn" id="addBtn">+</button>
    </div>
  </div>
  <div class="history" id="history"></div>

  <div class="main-wrap">
    <div class="main" id="mainArea">
      <canvas id="chartCanvas"></canvas>
      <div class="mult-overlay">
        <div class="mult" id="mult" style="color:#ff4d4d">1.00×</div>
        <div class="status" id="status">آماده</div>
      </div>
      <div class="countdown" id="countdown"><div class="countdown-num" id="cdNum">5</div></div>
    </div>
    <div class="action-bar">
      <button class="btn btn-bet" id="actionBtn">Place bet</button>
    </div>
  </div>

  <div class="players" id="players"></div>
</div>

<div class="modal" id="betModal">
  <div class="modal-content">
    <div class="modal-title">تنظیم شرط</div>
    <div class="quick-bets">
      <button class="quick-bet" data-val="20">۲۰</button>
      <button class="quick-bet" data-val="50">۵۰</button>
      <button class="quick-bet" data-val="100">۱۰۰</button>
      <button class="quick-bet" data-val="500">۵۰۰</button>
    </div>
    <div class="field">
      <label>مقدار شرط (حداقل ۲۰)</label>
      <input type="number" id="betInput" placeholder="حداقل 20" min="20">
    </div>
    <div class="field">
      <label>اتوکش (اختیاری — ضریب)</label>
      <input type="number" id="autoInput" placeholder="مثلاً 2.50" step="0.01" min="1.01">
    </div>
    <button class="modal-btn" id="saveBet">ذخیره</button>
    <button class="modal-btn modal-cancel" id="cancelBet">انصراف</button>
  </div>
</div>

<div class="modal" id="addModal">
  <div class="modal-content">
    <div class="modal-title">افزودن سکه</div>
    <div class="quick-bets">
      <button class="quick-bet" data-add="100">۱۰۰</button>
      <button class="quick-bet" data-add="1000">۱۰۰۰</button>
      <button class="quick-bet" data-add="10000">۱۰۰۰۰</button>
      <button class="quick-bet" data-add="100000">۱۰۰۰۰۰</button>
    </div>
    <div class="field">
      <label>مقدار دلخواه</label>
      <input type="number" id="addInput" placeholder="مثلاً 5000" min="1">
    </div>
    <button class="modal-btn" id="saveAdd">افزودن</button>
    <button class="modal-btn modal-cancel" id="cancelAdd">انصراف</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var INITIAL_BALANCE = 1000;
var MIN_BET = 20;
var WAIT_AFTER_CRASH = 5000;
var COUNTDOWN_SECONDS = 5;
var MY_NAME = 'Amir';

var phase = 'idle';
var multiplier = 1.00;
var crashPoint = 1.00;
var currentBet = 0;
var autoCashout = null;
var hasCashedOut = false;
var cashedOutMult = 0;
var betPlacedThisRound = false;
var balance = INITIAL_BALANCE;
var history = [];
var phaseStartTime = 0;
var lastFrameTime = 0;
var rafId = null;
var speed = 0.033;
var rocketPoints = [];
var maxMultReached = 1.00;
var crashFlashTime = 0;

var elMult = document.getElementById('mult');
var elStatus = document.getElementById('status');
var elHistory = document.getElementById('history');
var elBalance = document.getElementById('balance');
var elActionBtn = document.getElementById('actionBtn');
var elToast = document.getElementById('toast');
var elCd = document.getElementById('countdown');
var elCdNum = document.getElementById('cdNum');
var elModal = document.getElementById('betModal');
var elBetInput = document.getElementById('betInput');
var elAutoInput = document.getElementById('autoInput');
var elAddModal = document.getElementById('addModal');
var elAddInput = document.getElementById('addInput');
var elPlayers = document.getElementById('players');
var mainArea = document.getElementById('mainArea');
var canvas = document.getElementById('chartCanvas');
var ctx = canvas.getContext('2d');

var FAKE_NAMES = ['mersa','Velltr1x','Ваня','Kirill','Alex','Sara','Reza','Nima','Lena','Max','Olga','Dani','Aria','Behnam','Pouya','Kian','Nika','Ali','Hana','Sepehr','Tara','Omid','Mia','Armin','Negin'];
var fakePlayers = [];

function randomName() {
  return FAKE_NAMES[Math.floor(Math.random() * FAKE_NAMES.length)] + Math.floor(Math.random() * 99);
}

// هر بازیکن ربات ۱۰۰۰ پوینت داره
function generateFakePlayers() {
  fakePlayers = [];
  var count = 2 + Math.floor(Math.random() * 2);
  for (var i = 0; i < count; i++) {
    fakePlayers.push({
      name: randomName(),
      balance: 1000,
      bet: 0,
      targetMult: 0,
      cashedOut: false,
      cashedMult: 0,
      placedBet: false
    });
  }
}

// ربات‌ها تصمیم می‌گیرن که شرط بذارن یا نه (۸۰٪ احتمال)
function decideBotBets() {
  for (var i = 0; i < fakePlayers.length; i++) {
    var p = fakePlayers[i];
    if (Math.random() < 0.8 && p.balance >= MIN_BET) {
      // شرط تصادفی بین ۲۰ تا ۵۰٪ موجودی
      var maxBet = Math.min(p.balance, 1000);
      var minB = Math.min(MIN_BET, maxBet);
      var betAmount = Math.floor(minB + Math.random() * (maxBet - minB));
      if (betAmount >= MIN_BET) {
        p.bet = betAmount;
        p.balance -= betAmount;
        p.placedBet = true;
        p.targetMult = 1.1 + Math.random() * 5; // هدف تصادفی
      } else {
        p.placedBet = false;
        p.bet = 0;
      }
    } else {
      p.placedBet = false;
      p.bet = 0;
    }
  }
}

function updateFakePlayers() {
  for (var i = 0; i < fakePlayers.length; i++) {
    var p = fakePlayers[i];
    if (p.placedBet && !p.cashedOut && multiplier >= p.targetMult && phase === 'running') {
      p.cashedOut = true;
      p.cashedMult = p.targetMult;
      p.balance += Math.round(p.bet * p.targetMult);
    }
  }
  renderPlayers();
}

function renderPlayers() {
  var html = '';
  var myWin = hasCashedOut ? Math.round(currentBet * cashedOutMult) : 0;
  html += '<div class="player">';
  html += '<div class="player-avatar">A</div>';
  html += '<div class="player-info">';
  html += '<div class="player-name">' + MY_NAME + ' <span style="color:#3b82f6;font-size:10px;">(شما)</span></div>';
  if (betPlacedThisRound && currentBet > 0) {
    var displayMult = hasCashedOut ? cashedOutMult : multiplier;
    html += '<div class="player-bet"><span class="mini-coin"></span>' + currentBet + ' ×' + displayMult.toFixed(2) + '</div>';
  } else {
    html += '<div class="player-bet" style="opacity:0.5;">بدون شرط</div>';
  }
  html += '</div>';
  if (hasCashedOut) {
    html += '<div class="player-win cashed"><span class="mini-coin"></span>' + myWin + '</div>';
  } else if (betPlacedThisRound && currentBet > 0) {
    html += '<div class="player-win"><span class="mini-coin"></span>' + Math.round(currentBet * multiplier) + '</div>';
  } else {
    html += '<div class="player-win" style="opacity:0.4;"><span class="mini-coin"></span>0</div>';
  }
  html += '</div>';

  for (var i = 0; i < fakePlayers.length; i++) {
    var p = fakePlayers[i];
    html += '<div class="player">';
    html += '<div class="player-avatar" style="background:linear-gradient(135deg,#7c3aed,#a855f7);">?</div>';
    html += '<div class="player-info">';
    html += '<div class="player-name">' + p.name + '</div>';
    if (p.placedBet && p.bet > 0) {
      html += '<div class="player-bet"><span class="mini-coin"></span>' + p.bet + ' ×' + multiplier.toFixed(2) + '</div>';
    } else {
      html += '<div class="player-bet" style="opacity:0.5;">بدون شرط</div>';
    }
    html += '</div>';
    if (p.cashedOut) {
      html += '<div class="player-win cashed"><span class="mini-coin"></span>' + Math.round(p.bet * p.cashedMult) + '</div>';
    } else if (p.placedBet && p.bet > 0) {
      html += '<div class="player-win"><span class="mini-coin"></span>' + Math.round(p.bet * multiplier) + '</div>';
    } else {
      html += '<div class="player-win" style="opacity:0.4;"><span class="mini-coin"></span>0</div>';
    }
    html += '</div>';
  }
  elPlayers.innerHTML = html;
}

function resizeCanvas() {
  var rect = mainArea.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', function() { setTimeout(resizeCanvas, 200); });
setTimeout(resizeCanvas, 100);

var stars = [];
var STAR_COLORS = ['#ff66b3', '#66b3ff', '#ffcc66', '#b366ff', '#66ffcc', '#ff9999'];

function generateStars() {
  stars = [];
  for (var i = 0; i < 60; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: 0.5 + Math.random() * 1.5,
      color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
      alpha: 0.3 + Math.random() * 0.5,
      twinkleSpeed: 0.5 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(now) {
  var rect = mainArea.getBoundingClientRect();
  var W = rect.width, H = rect.height;
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var twinkle = 0.5 + 0.5 * Math.sin(now * 0.001 * s.twinkleSpeed + s.phase);
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.globalAlpha = s.alpha * twinkle;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 6;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function getColor(m) {
  if (m <= 1.50) return '#ff4d4d';
  if (m <= 2.00) return '#66a3ff';
  if (m <= 2.75) return '#4d94ff';
  if (m <= 3.50) return '#2673ff';
  if (m <= 4.00) return '#0052ff';
  if (m <= 6.00) return '#a366ff';
  if (m <= 8.00) return '#b366ff';
  if (m <= 9.99) return '#cc66ff';
  return '#ffd700';
}

function getHistClass(m) {
  if (m <= 1.50) return 'h-red';
  if (m <= 4.00) return 'h-blue';
  if (m <= 9.99) return 'h-purple';
  return 'h-gold';
}

// ============================================================
// 🎲 CRASH POINT — کاملاً تصادفی مثل قبل
// ============================================================
function genCrash() {
  var u = Math.random();
  var point = -Math.log(1 - u) * 0.85 + 1.00;
  return Math.max(1.00, Math.floor(point * 100) / 100);
}

function showToast(text, type) {
  elToast.textContent = text;
  elToast.className = 'toast show ' + type;
  setTimeout(function() { elToast.className = 'toast'; }, 1800);
}

function updateBalance() {
  elBalance.textContent = Math.round(balance).toLocaleString('fa-IR');
}

function updateActionButton() {
  if (phase === 'countdown') {
    if (betPlacedThisRound && currentBet > 0) {
      elActionBtn.textContent = 'شرط: ' + currentBet + ' ✓';
      elActionBtn.className = 'btn btn-cash';
      elActionBtn.disabled = false;
    } else {
      elActionBtn.textContent = 'Place bet';
      elActionBtn.className = 'btn btn-bet';
      elActionBtn.disabled = false;
    }
  }
  else if (phase === 'running') {
    if (betPlacedThisRound && currentBet > 0 && !hasCashedOut) {
      var win = Math.round(currentBet * multiplier);
      elActionBtn.textContent = 'برداشت: ' + win.toLocaleString('fa-IR');
      elActionBtn.className = 'btn btn-cash';
      elActionBtn.disabled = false;
    } else if (betPlacedThisRound && hasCashedOut) {
      elActionBtn.textContent = 'برداشت شد ✓';
      elActionBtn.className = 'btn btn-cash';
      elActionBtn.disabled = true;
    } else {
      elActionBtn.textContent = 'شرط نبستی';
      elActionBtn.className = 'btn btn-bet';
      elActionBtn.disabled = true;
    }
  }
  else {
    elActionBtn.textContent = 'Place bet';
    elActionBtn.className = 'btn btn-bet';
    elActionBtn.disabled = true;
  }
}

function renderHistory() {
  var html = '';
  for (var i = 0; i < history.length; i++) {
    html += '<div class="h-item ' + getHistClass(history[i]) + '">' + history[i].toFixed(2) + '×</div>';
  }
  elHistory.innerHTML = html;
}

function drawChart(now) {
  var rect = mainArea.getBoundingClientRect();
  var W = rect.width;
  var H = rect.height;
  ctx.clearRect(0, 0, W, H);
  drawStars(now);

  var padL = 44, padR = 20, padT = 20, padB = 30;
  var cw = W - padL - padR;
  var ch = H - padT - padB;
  var color = getColor(multiplier);

  ctx.font = '10px -apple-system';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  var yMax = Math.max(maxMultReached * 1.1, 2);
  var yTicks = 4;
  for (var i = 0; i <= yTicks; i++) {
    var val = (yMax / yTicks) * i;
    var y = padT + ch - (ch * (i / yTicks));
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + cw, y);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.stroke();
    ctx.fillText(val.toFixed(2) + '×', 4, y);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var xTicks = 5;
  for (var j = 0; j <= xTicks; j++) {
    var x = padL + (cw * (j / xTicks));
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + ch);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.stroke();
  }

  if (rocketPoints.length >= 2) {
    ctx.beginPath();
    ctx.moveTo(rocketPoints[0].x, rocketPoints[0].y);
    for (var k = 1; k < rocketPoints.length; k++) {
      ctx.lineTo(rocketPoints[k].x, rocketPoints[k].y);
    }
    ctx.lineTo(rocketPoints[rocketPoints.length - 1].x, padT + ch);
    ctx.lineTo(rocketPoints[0].x, padT + ch);
    ctx.closePath();
    var grad = ctx.createLinearGradient(0, padT, 0, padT + ch);
    grad.addColorStop(0, color + '33');
    grad.addColorStop(1, color + '00');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(rocketPoints[0].x, rocketPoints[0].y);
    for (var m = 1; m < rocketPoints.length; m++) {
      ctx.lineTo(rocketPoints[m].x, rocketPoints[m].y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.stroke();
    ctx.shadowBlur = 0;

    var last = rocketPoints[rocketPoints.length - 1];
    ctx.save();
    var prev = rocketPoints[rocketPoints.length - 2];
    var angle = Math.atan2(last.y - prev.y, last.x - prev.x);
    ctx.translate(last.x, last.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(-18, -7);
    ctx.lineTo(-32, 0);
    ctx.lineTo(-18, 7);
    ctx.closePath();
    var flameGrad = ctx.createLinearGradient(-32, 0, -18, 0);
    flameGrad.addColorStop(0, '#ffcc00');
    flameGrad.addColorStop(1, '#ff4d4d');
    ctx.fillStyle = flameGrad;
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = '30px -apple-system';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🚀', 0, 0);
    ctx.restore();
  }

  if (phase === 'crashed' && now - crashFlashTime < 600) {
    var alpha = 1 - (now - crashFlashTime) / 600;
    ctx.fillStyle = 'rgba(255,77,77,' + (alpha * 0.3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function gameLoop(now) {
  rafId = requestAnimationFrame(gameLoop);
  var elapsed = now - phaseStartTime;

  if (phase === 'countdown') {
    var sec = Math.ceil((COUNTDOWN_SECONDS * 1000 - elapsed) / 1000);
    if (sec < 0) sec = 0;
    if (sec !== parseInt(elCdNum.textContent)) {
      elCdNum.textContent = sec > 0 ? sec : 0;
    }
    if (elapsed >= COUNTDOWN_SECONDS * 1000) {
      elCd.classList.remove('on');
      beginRound(now);
    }
  }
  else if (phase === 'running') {
    var dt = now - lastFrameTime;
    lastFrameTime = now;
    speed *= Math.pow(1.0008, dt / 100);
    multiplier += speed * (dt / 100);
    multiplier = Math.round(multiplier * 100) / 100;

    if (multiplier > maxMultReached) maxMultReached = multiplier;

    if (autoCashout && !hasCashedOut && betPlacedThisRound && multiplier >= autoCashout) {
      doCashout();
    }

    elMult.textContent = multiplier.toFixed(2) + '×';
    elMult.style.color = getColor(multiplier);

    var rect = mainArea.getBoundingClientRect();
    var padL = 44, padR = 20, padT = 20, padB = 30;
    var cw = rect.width - padL - padR;
    var ch = rect.height - padT - padB;
    var yMax = Math.max(maxMultReached * 1.1, 2);
    var xProgress = Math.min(elapsed / 6000, 1);
    var yProgress = (multiplier - 1) / (yMax - 1);
    var px = padL + cw * xProgress;
    var py = padT + ch - ch * yProgress;
    rocketPoints.push({ x: px, y: py });

    updateFakePlayers();
    updateActionButton();

    if (multiplier >= crashPoint) crash();
  }
  else if (phase === 'crashed') {
    updateActionButton();
    if (elapsed >= WAIT_AFTER_CRASH) startCountdown(now);
  }

  drawChart(now);
}

function startCountdown(now) {
  phase = 'countdown';
  phaseStartTime = now || performance.now();
  elStatus.textContent = 'شرط‌بندی...';
  elStatus.className = 'status wait';
  elCdNum.textContent = COUNTDOWN_SECONDS;
  elCd.classList.add('on');
  rocketPoints = [];
  maxMultReached = 1.00;
  multiplier = 1.00;
  elMult.textContent = '1.00×';
  elMult.style.color = getColor(1.00);

  betPlacedThisRound = false;
  currentBet = 0;
  hasCashedOut = false;
  cashedOutMult = 0;

  // رباتا تصمیم می‌گیرن شرط بذارن
  decideBotBets();

  updateActionButton();
  renderPlayers();
}

function beginRound(now) {
  phase = 'running';
  phaseStartTime = now || performance.now();
  lastFrameTime = phaseStartTime;
  multiplier = 1.00;
  maxMultReached = 1.00;
  crashPoint = genCrash();
  hasCashedOut = false;
  cashedOutMult = 0;
  speed = 0.033;
  rocketPoints = [];

  elMult.textContent = '1.00×';
  elMult.style.color = getColor(1.00);
  elStatus.textContent = 'در حال صعود...';
  elStatus.className = 'status';
  updateActionButton();
}

function crash() {
  phase = 'crashed';
  phaseStartTime = performance.now();
  crashFlashTime = performance.now();
  elMult.textContent = multiplier.toFixed(2) + '×';
  elMult.style.color = '#ff4d4d';
  elStatus.textContent = '💥 ترکید!';
  elStatus.className = 'status crash';

  history.unshift(multiplier);
  if (history.length > 20) history.pop();
  renderHistory();

  if (!hasCashedOut && betPlacedThisRound && currentBet > 0) {
    showToast('باختی ' + currentBet + ' سکه', 'lose');
  }

  // رباتایی که شرط بستن و نبردن، پولشون رفت
  for (var i = 0; i < fakePlayers.length; i++) {
    var p = fakePlayers[i];
    if (p.placedBet && !p.cashedOut) {
      // باختن — شرط قبلاً کم شده، پس هیچی
    }
  }

  updateActionButton();
}

function doCashout() {
  if (hasCashedOut || phase !== 'running') return;
  if (!betPlacedThisRound || currentBet <= 0) return;
  hasCashedOut = true;
  cashedOutMult = multiplier;
  var win = Math.round(currentBet * multiplier);
  balance += win;
  updateBalance();
  showToast('+' + win.toLocaleString('fa-IR') + ' سکه', 'win');
  elStatus.textContent = 'برداشت در ' + multiplier.toFixed(2) + '×';
  updateActionButton();
}

elActionBtn.addEventListener('click', function() {
  if (phase === 'countdown') {
    if (betPlacedThisRound && currentBet > 0) {
      currentBet = 0;
      betPlacedThisRound = false;
      autoCashout = null;
      updateActionButton();
      renderPlayers();
      showToast('شرط لغو شد', 'lose');
    } else {
      elBetInput.value = '';
      elAutoInput.value = '';
      elModal.classList.add('on');
    }
  }
  else if (phase === 'running') {
    doCashout();
  }
});

document.getElementById('cancelBet').addEventListener('click', function() {
  elModal.classList.remove('on');
});

var quickBetBtns = document.querySelectorAll('#betModal .quick-bet');
for (var i = 0; i < quickBetBtns.length; i++) {
  quickBetBtns[i].addEventListener('click', function() {
    elBetInput.value = this.getAttribute('data-val');
  });
}

document.getElementById('saveBet').addEventListener('click', function() {
  var b = parseFloat(elBetInput.value) || 0;
  var a = parseFloat(elAutoInput.value);
  if (b < MIN_BET) {
    showToast('حداقل شرط ' + MIN_BET + ' پوینته', 'lose');
    return;
  }
  if (b > balance) {
    showToast('موجودی کافی نیست', 'lose');
    return;
  }
  currentBet = b;
  autoCashout = (a && a > 1.00) ? a : null;
  betPlacedThisRound = true;
  balance -= currentBet;
  updateBalance();
  updateActionButton();
  renderPlayers();
  elModal.classList.remove('on');
  showToast('شرط ' + currentBet + ' ثبت شد', 'win');
});

document.getElementById('addBtn').addEventListener('click', function() {
  elAddInput.value = '';
  elAddModal.classList.add('on');
});

document.getElementById('cancelAdd').addEventListener('click', function() {
  elAddModal.classList.remove('on');
});

var quickAddBtns = document.querySelectorAll('#addModal .quick-bet');
for (var j = 0; j < quickAddBtns.length; j++) {
  quickAddBtns[j].addEventListener('click', function() {
    elAddInput.value = this.getAttribute('data-add');
  });
}

document.getElementById('saveAdd').addEventListener('click', function() {
  var amt = parseFloat(elAddInput.value) || 0;
  if (amt > 0) {
    balance += amt;
    updateBalance();
    showToast('+' + amt.toLocaleString('fa-IR') + ' سکه', 'win');
  }
  elAddModal.classList.remove('on');
});

updateBalance();
resizeCanvas();
generateStars();

phaseStartTime = performance.now();
startCountdown(phaseStartTime);
rafId = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
